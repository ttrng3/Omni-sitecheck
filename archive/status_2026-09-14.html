<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMNI Sitecheck Điều hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FFFFFF; --surface:#FAFAF8; --sunk:#F3F3EF;
  --ink:#1C1C1A; --ink-soft:#44443F; --muted:#6B6B64; --rule:#E4E4DF;
  --accent:#0F6E52; --accent-bg:#EAF3EF; --accent-2:#7FA99B;
  --critical:#B02418; --warning:#9A6B00;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:26px 24px 64px}
h1{font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:-.01em;margin:2px 0 5px;text-wrap:balance}
.subtitle{color:var(--muted);font-size:12.5px}
.subtitle strong{color:var(--ink-soft)}
header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.badge{display:inline-block;padding:3px 9px;background:var(--accent-bg);color:var(--accent);border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.verdict{background:var(--accent-bg);border:1px solid var(--rule);border-left:3px solid var(--critical);border-radius:5px;padding:14px 16px;margin-bottom:16px}
.verdict .lead{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.35;color:var(--ink)}
.verdict p{margin:7px 0 0;color:var(--ink-soft);font-size:12.5px}
.recon{font-size:12px;color:var(--muted);margin:0 0 20px;padding:9px 13px;border:1px solid var(--rule);border-radius:5px;background:var(--surface)}
.recon b{color:var(--ink-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:#FFFFFF;border:1px solid var(--rule);border-radius:8px;padding:13px 15px}
.kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--serif);font-size:27px;font-weight:700;margin-top:5px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .value.crit{color:var(--critical)}
.kpi .delta{font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--warning)} .delta.down{color:var(--accent)} .delta.flat{color:var(--muted)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#FFFFFF;border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chart-wrap{position:relative;height:240px}
.chart-wrap.tall{height:280px}
.view-toggle{display:inline-flex;background:var(--sunk);border-radius:6px;padding:2px}
.view-toggle button{border:0;background:transparent;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);border-radius:4px;cursor:pointer;font-family:inherit}
.view-toggle button:hover{color:var(--ink)}
.view-toggle button.active{background:#FFFFFF;color:var(--accent);border:1px solid var(--rule)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 14px;background:#FFFFFF;border:1px solid var(--rule);border-radius:8px;margin-bottom:14px}
.filters label{font-size:12px;color:var(--muted);margin-right:4px}
.filters select,.filters input{padding:6px 9px;font-size:13px;border:1px solid var(--rule);border-radius:6px;background:#FFFFFF;color:var(--ink);font-family:inherit}
.filters .stat{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--surface);text-align:left;padding:9px 10px;font-weight:600;color:var(--ink-soft);border-bottom:1px solid var(--rule);position:sticky;top:0;cursor:pointer;user-select:none;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
thead th:hover{background:var(--sunk)}
thead th .sort-arrow{display:inline-block;margin-left:4px;font-size:10px;opacity:.5}
thead th.sort-active{background:var(--accent-bg);color:var(--accent)}
thead th.sort-active .sort-arrow{opacity:1}
tbody td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover{background:var(--surface)}
.num-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.num-table td.muted{color:var(--muted);font-style:italic}
.num-table a.src{color:var(--accent);text-decoration:none;font-size:12px}
.num-table a.src:hover{text-decoration:underline}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.done{background:var(--accent-bg);color:var(--accent)}
.pill.progress{background:#FBF4E0;color:var(--warning)}
.pill.scheduled{background:#EAF1F5;color:#3C5A6B}
.pill.site-LA{background:#EEF3F1;color:#3C6152}
.pill.site-VN{background:var(--accent-bg);color:var(--accent)}
.pill.dept{background:var(--sunk);color:var(--ink-soft)}
.pill.verify{background:#FBEEEC;color:var(--critical)}
.ref-badge{display:inline-block;margin-left:6px;padding:1px 7px;background:var(--sunk);color:var(--ink-soft);border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.03em;vertical-align:middle}
.ref-banner{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--ink-soft);margin:14px 0}
.ref-banner strong{color:var(--ink)}
.empty-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;font-style:italic;padding:0 16px}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--accent-bg)}
tbody tr.selected{background:var(--accent-bg) !important}
tbody tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.footer-note{margin-top:18px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;color:var(--ink-soft);font-size:12px}
.footer-note a{color:var(--accent)}
details{font-size:12px;color:var(--muted);margin-top:6px}
summary{cursor:pointer}
@media (max-width:900px){.grid,.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}
@media print{
  body,.card,.kpi,.filters,.verdict,.ref-banner,.footer-note{background:#fff !important}
  :root{--muted:#222;--ink-soft:#222}
  .card,.kpi,section,.grid-3{break-inside:avoid}
  .view-toggle{display:none}
  thead th{position:static}
}
</style>
</head>
<body>
STOP_PLACEHOLDER_DO_NOT_PUSH
</body>
</html>
