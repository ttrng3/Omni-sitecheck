name: Archive dashboard snapshot

# Runs server-side on every push to main and copies index.html to a dated
# archive path. This exists so the dated snapshot never has to be pushed as
# a second, separately-transcribed copy of the (large) dashboard HTML by any
# client — the mirror routine only ever needs to write index.html once;
# GitHub does the copy. No path filter on purpose: it also self-heals if a
# stray push ever lands a wrong/corrupted archive file for today without
# touching index.html in the same push — the next push of any kind on main
# will notice the mismatch and overwrite it with the correct content.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to archive as (YYYY-MM-DD). Defaults to today."
        required: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy index.html to dated archive
        run: |
          set -euo pipefail
          today="${{ inputs.date }}"
          if [ -z "$today" ]; then
            today=$(date -u +%Y-%m-%d)
          fi
          mkdir -p archive
          dest="archive/status_${today}.html"

          if [ -f "$dest" ] && cmp -s index.html "$dest"; then
            echo "Archive for $today already matches index.html; nothing to do."
            exit 0
          fi

          cp index.html "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Auto-archive dashboard snapshot ${today}"
          git push
